[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pySpecMUSE"
dynamic = ["version"]
description = "Utilities and scripts for the ECOGAL project to extract spectra from MUSE cubes."
readme = { file = "README", content-type = "text/plain" }
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
authors = [{ name = "Leonardo Testi", email = "ltesti120a@gmail.com" }]
requires-python = ">=3.9"
# Packages installed automatically by pip if missing from the environment
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "astropy>=5.0",
    "photutils>=1.5",     # ApertureStats
    "astroquery>=0.4.6",  # Gaia DR3 queries in vista_gaia_astrocorr
]
keywords = ["science", "astronomy", "optical spectroscopy", "integral field spectroscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
notebooks = ["jupyter", "pandas"]

[project.urls]
Homepage = "https://github.com/ltesti/pySpecMUSE"
Source = "https://github.com/ltesti/pySpecMUSE"

[tool.setuptools]
packages = ["pySpecMUSE"]

[tool.setuptools.dynamic]
version = { attr = "pySpecMUSE._version.__version__" }
